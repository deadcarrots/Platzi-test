<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{--bg:#f1f5f1;--card:#ffffff;--text:#16211a;--muted:#5f6f64;--board:#f7faf7;--grid:#e3eae3;--snake:#22a45d;--head:#137a3f;--food:#e5484d;--btn:#e6ece6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1410;--card:#16201a;--text:#e8f0ea;--muted:#8fa296;--board:#101812;--grid:#1b2820;--snake:#3ecf7a;--head:#7be8a5;--food:#ff6b6f;--btn:#223028;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1410;--card:#16201a;--text:#e8f0ea;--muted:#8fa296;--board:#101812;--grid:#1b2820;--snake:#3ecf7a;--head:#7be8a5;--food:#ff6b6f;--btn:#223028;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.app{width:100%;max-width:440px;background:var(--card);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
h1{margin:0 0 12px;font-size:1.5rem;letter-spacing:.5px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.stat{font-size:.95rem;color:var(--muted)}
.stat b{color:var(--text);font-size:1.15rem}
.wrap{position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:12px;background:var(--board);touch-action:none}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.45);border-radius:12px;color:#fff;padding:16px;gap:6px}
#msg h2{margin:0;font-size:1.6rem}
#msg p{margin:0;font-size:.95rem;opacity:.92}
#msg.hide{display:none}
.row{display:flex;gap:8px;margin-top:12px}
button{font:inherit;border:0;border-radius:12px;background:var(--btn);color:var(--text);padding:12px;cursor:pointer;flex:1;font-weight:600}
button:active{transform:scale(.97)}
button.main{background:var(--snake);color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:14px}
.pad button{padding:0;font-size:1.3rem}
.pad .u{grid-column:2;grid-row:1}
.pad .l{grid-column:1;grid-row:2}
.pad .d{grid-column:2;grid-row:2}
.pad .r{grid-column:3;grid-row:2}
.hint{margin:12px 0 0;text-align:center;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main class="app">
  <h1>Snake</h1>
  <div class="top">
    <div class="stat">Puntos: <b id="score">0</b></div>
    <div class="stat">Récord: <b id="best">0</b></div>
  </div>
  <div class="wrap">
    <canvas id="c" width="400" height="400" aria-label="Tablero del juego"></canvas>
    <div id="msg"><h2>¿Listo?</h2><p>Pulsa una flecha o desliza para empezar</p></div>
  </div>
  <div class="row">
    <button id="pause">Pausa</button>
    <button id="restart" class="main">Reiniciar</button>
  </div>
  <div class="pad" aria-label="Controles">
    <button class="u" data-d="0,-1" aria-label="Arriba">▲</button>
    <button class="l" data-d="-1,0" aria-label="Izquierda">◀</button>
    <button class="d" data-d="0,1" aria-label="Abajo">▼</button>
    <button class="r" data-d="1,0" aria-label="Derecha">▶</button>
  </div>
  <p class="hint">Flechas o WASD para moverte · Espacio para pausar · Enter para reiniciar</p>
</main>
<script>
(function(){
  var N=20,S=400,C=S/N;
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');
  var snake,dir,queue,food,score,best=0,state='ready',timer;
  try{best=parseInt(localStorage.getItem('snake-best'),10)||0}catch(e){}

  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
  function show(t,p){msg.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';msg.classList.remove('hide')}
  function hide(){msg.classList.add('hide')}

  function reset(){
    clearTimeout(timer);
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0};queue=[];score=0;state='ready';
    placeFood();updateStats();draw();
    show('¿Listo?','Pulsa una flecha o desliza para empezar');
  }
  function placeFood(){
    var p;
    do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
    while(snake.some(function(s){return s.x===p.x&&s.y===p.y}));
    food=p;
  }
  function updateStats(){scoreEl.textContent=score;bestEl.textContent=best}

  function turn(dx,dy){
    var last=queue.length?queue[queue.length-1]:dir;
    if((last.x===-dx&&last.y===-dy)||(last.x===dx&&last.y===dy))return;
    if(queue.length<3)queue.push({x:dx,y:dy});
    if(state==='ready'||state==='paused')start();
  }
  function start(){
    if(state==='over')return;
    state='running';hide();loop();
  }
  function loop(){
    clearTimeout(timer);
    if(state!=='running')return;
    step();
    if(state==='running')timer=setTimeout(loop,Math.max(60,140-score*3));
  }
  function step(){
    if(queue.length)dir=queue.shift();
    var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    var ate=(h.x===food.x&&h.y===food.y);
    var body=ate?snake:snake.slice(0,-1);
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(function(s){return s.x===h.x&&s.y===h.y})){end(false);return}
    snake.unshift(h);
    if(ate){
      score++;
      if(score>best){best=score;try{localStorage.setItem('snake-best',String(best))}catch(e){}}
      if(snake.length>=N*N){updateStats();draw();end(true);return}
      placeFood();
    }else snake.pop();
    updateStats();draw();
  }
  function end(win){
    state='over';clearTimeout(timer);draw();
    show(win?'¡Ganaste!':'Game over','Puntos: '+score+' · Pulsa Reiniciar o Enter');
  }
  function togglePause(){
    if(state==='running'){state='paused';clearTimeout(timer);show('Pausa','Pulsa Espacio o Pausa para seguir')}
    else if(state==='paused'){start()}
  }

  function draw(){
    ctx.fillStyle=css('--board');ctx.fillRect(0,0,S,S);
    ctx.strokeStyle=css('--grid');ctx.lineWidth=1;ctx.beginPath();
    for(var i=1;i<N;i++){ctx.moveTo(i*C,0);ctx.lineTo(i*C,S);ctx.moveTo(0,i*C);ctx.lineTo(S,i*C)}
    ctx.stroke();
    ctx.fillStyle=css('--food');ctx.beginPath();
    ctx.arc(food.x*C+C/2,food.y*C+C/2,C*0.38,0,Math.PI*2);ctx.fill();
    var sn=css('--snake'),hd=css('--head');
    snake.forEach(function(s,i){
      ctx.fillStyle=i===0?hd:sn;
      var r=5,x=s.x*C+1,y=s.y*C+1,w=C-2;
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(x,y,w,w,r);else ctx.rect(x,y,w,w);
      ctx.fill();
    });
  }

  document.addEventListener('keydown',function(e){
    var k=e.key;
    var map={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
    if(map[k]){e.preventDefault();turn(map[k][0],map[k][1])}
    else if(k===' '){e.preventDefault();togglePause()}
    else if(k==='Enter'){e.preventDefault();reset()}
  });
  document.querySelectorAll('.pad button').forEach(function(b){
    b.addEventListener('click',function(){var d=b.getAttribute('data-d').split(',');turn(+d[0],+d[1])});
  });
  document.getElementById('pause').addEventListener('click',togglePause);
  document.getElementById('restart').addEventListener('click',reset);

  var tx=0,ty=0;
  cv.addEventListener('touchstart',function(e){var t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
  cv.addEventListener('touchend',function(e){
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
  },{passive:true});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='running')togglePause()});
  if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);

  reset();
})();
</script>
</body>
</html>
